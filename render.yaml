services:
  - type: web
    name: classpulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: 1
